name: Deploy do Hub Data na Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Build estático do projeto
        run: npm run build:static

      - name: Mostrar arquivos gerados
        run: ls -la dist/client/

      - name: Verificar conexão FTPS da Hostinger
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          node -e "const dns=require('node:dns').promises; const net=require('node:net'); (async()=>{ if(!process.env.FTP_HOST) throw new Error('O secret FTP_HOST não foi configurado'); const host=process.env.FTP_HOST.replace(/^ftps?:\/\//,'').replace(/\/$/,''); await dns.lookup(host); await new Promise((resolve,reject)=>{ const socket=net.createConnection({host,port:21,timeout:20000},()=>{socket.destroy();resolve()}); socket.on('timeout',()=>{socket.destroy();reject(new Error('A porta FTPS 21 da Hostinger não respondeu'))}); socket.on('error',reject) }); console.log('Servidor FTPS acessível'); })().catch(error=>{ console.error(error.message); process.exit(1) })"

      - name: Deploy FTPS para Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          protocol: ftps
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/client/
          server-dir: /
          dangerous-clean-slate: false
          dry-run: false
          log-level: standard
